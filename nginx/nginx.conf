worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream Backend API
    upstream backend_server {
        server backend:8000;
    }

    # Upstream Frontend Next.js
    upstream frontend_server {
        server frontend:3000;
    }

    # Dynamic CORS mapping
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" "$http_origin";
        "~^https?://34\.21\.210\.223(:[0-9]+)?$" "$http_origin";
    }

    # 1. HTTP Server: Tự động Redirect sang HTTPS
    server {
        listen 80;
        server_name 34.21.210.223 localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server: Phục vụ ứng dụng
    server {
        listen 443 ssl;
        server_name 34.21.210.223 localhost;

        # Đường dẫn tới chứng chỉ SSL (Đảm bảo đã mount đúng vào container)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backend API Routing
        location /api/ {
            proxy_pass http://backend_server;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location /health {
            proxy_pass http://backend_server/health;
        }

        # Frontend Routing
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}