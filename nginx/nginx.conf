worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Rosbag uploads are large but bounded by the backend's MAX_UPLOAD_BYTES
    # (1 GiB default); raise both together if multi-GB bags need to go through.
    client_max_body_size 512m;

    # Per-IP request rate limit. The backend has its own in-memory limiter, but
    # it only sees traffic that already reached a worker — this sheds floods at
    # the edge. `burst` absorbs normal bursts; requests past it get 503.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream Backend API
    upstream backend_server {
        server backend:8000;
    }

    # Upstream Frontend Next.js
    upstream frontend_server {
        server frontend:3000;
    }

    # Dynamic CORS mapping. The backend (FastAPI CORSMiddleware) is the primary
    # CORS authority now; this echo is a fallback for responses nginx serves
    # itself. Replace the IP line with the real frontend host/domain on deploy.
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" "$http_origin";
        "~^https?://34\.21\.210\.223(:[0-9]+)?$" "$http_origin";
    }

    # 1. HTTP Server: Tự động Redirect sang HTTPS
    server {
        listen 80;
        server_name 34.21.210.223 localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server: Phục vụ ứng dụng
    server {
        listen 443 ssl;
        server_name 34.21.210.223 localhost;

        # Đường dẫn tới chứng chỉ SSL (Đảm bảo đã mount đúng vào container)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers. The Next.js app also sets these (next.config.mjs) for
        # its own responses; nginx repeats them so /health, error pages and any
        # non-proxied response are covered too. CSP is left to Next, which can
        # scope it per-route. `add_header` does not inherit into a location that
        # declares its own, so each block below repeats them.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Backend API Routing
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://backend_server;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location /health {
            proxy_pass http://backend_server/health;
        }

        # Frontend Routing
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}