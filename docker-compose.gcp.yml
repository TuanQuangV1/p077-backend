# GCP deployment override for docker-compose.
# Copied to /opt/app on the VM by the CI/CD workflow. Images are pulled from
# Artifact Registry (no local builds), data + config persist on the data disk.

services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: always
    env_file:
      - /opt/app/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      RUN_DB_PATH: data/runs.db
    volumes:
      - /opt/app/data:/app/data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: always
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - /opt/app/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
