name: Setup Frontend (Node/pnpm)
description: Install pnpm, Node.js, cache and restore node_modules, install frontend dependencies

inputs:
  node-version:
    description: Node.js version to install
    default: "24"
  pnpm-version:
    description: pnpm version to install
    default: "11"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Cache frontend node_modules
      id: nodemod-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: frontend/node_modules
        key: node-modules-${{ runner.os }}-pnpm${{ inputs.pnpm-version }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          node-modules-${{ runner.os }}-pnpm${{ inputs.pnpm-version }}-

    - name: Install frontend dependencies
      if: steps.nodemod-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: pnpm install
