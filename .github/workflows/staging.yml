name: CD - Azure Staging Deployment

on:
  workflow_run:
    workflows: ["CI", "CodeQL", "Gitleaks", "Trivy Security Scan", "Docker Security"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-deployment
  cancel-in-progress: true

env:
  APP_ENV: staging
  AZURE_LOCATION: eastus
  ACR_NAME: acrai20krosbagstaging
  RESOURCE_GROUP: rg-ai20krosbag-staging
  STAGING_HEALTH_URL: https://app-ai20krosbag-staging-backend.eastus.azurecontainerapps.io/health

jobs:
  build-and-deploy-staging:
    name: Build Docker Images & Deploy to Azure
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure Login (Service Principal)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Container Registry Login
        uses: azure/docker-login@83efeb77770c98b620c73055fbb59b2847e17dc0 # v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: backend
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/backend:staging-latest
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: frontend
          push: true
          build-args: NEXT_PUBLIC_API_BASE_URL=https://app-ai20krosbag-staging-backend.eastus.azurecontainerapps.io
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/frontend:staging-latest
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init & Apply (Azure Staging)
        run: |
          cd terraform
          terraform init -backend=false
          terraform plan -var-file=environments/staging.tfvars -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Retrieve Deployed Azure Container Apps URLs
        run: |
          echo "=========================================================="
          echo "🌐 AZURE STAGING DEPLOYED CONTAINER APP ENDPOINTS:"
          FRONTEND_URL=$(az containerapp show --name app-ai20krosbag-staging-frontend --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "app-ai20krosbag-staging-frontend.eastus.azurecontainerapps.io")
          BACKEND_URL=$(az containerapp show --name app-ai20krosbag-staging-backend --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "app-ai20krosbag-staging-backend.eastus.azurecontainerapps.io")
          echo "Frontend Web UI : https://$FRONTEND_URL"
          echo "Backend API     : https://$BACKEND_URL"
          echo "API Health Check: https://$BACKEND_URL/health"
          echo "=========================================================="

      - name: Staging Automated Health Check Gate
        run: |
          echo "Executing Azure Staging Health Check Gate..."
          curl --fail --connect-timeout 10 --max-time 15 --retry 6 --retry-delay 10 ${{ env.STAGING_HEALTH_URL }}
