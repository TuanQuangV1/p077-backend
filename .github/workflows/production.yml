name: CD - Azure Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  APP_ENV: production
  AZURE_LOCATION: eastus
  ACR_NAME: acrai20krosbagprod
  RESOURCE_GROUP: rg-ai20krosbag-production
  PRODUCTION_HEALTH_URL: https://app-ai20krosbag-production-backend.eastus.azurecontainerapps.io/health

jobs:
  production-verification:
    name: Run Full Production Gatekeeper Tests
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Backend Dependencies
        run: pip install -e .[dev]

      - name: Run Ruff Lint
        run: ruff check src/ tests/

      - name: Run Backend Pytest Suite
        run: pytest tests/ --cov=src --cov-fail-under=75
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key-production

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install

      - name: Frontend Typecheck
        working-directory: frontend
        run: pnpm lint

  deploy-production:
    name: Deploy to Azure Production
    needs: production-verification
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Container Registry Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Production Image
        run: |
          REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          docker build \
            --target backend \
            -t $REGISTRY/backend:${{ github.sha }} \
            -t $REGISTRY/backend:latest .
          docker push $REGISTRY/backend:${{ github.sha }}
          docker push $REGISTRY/backend:latest

      - name: Build & Push Frontend Production Image
        run: |
          REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          docker build \
            --target frontend \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://app-ai20krosbag-production-backend.eastus.azurecontainerapps.io \
            -t $REGISTRY/frontend:${{ github.sha }} \
            -t $REGISTRY/frontend:latest .
          docker push $REGISTRY/frontend:${{ github.sha }}
          docker push $REGISTRY/frontend:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init & Apply (Azure Production)
        run: |
          cd terraform
          terraform init -backend=false
          terraform plan -var-file=environments/production.tfvars -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Retrieve Deployed Azure Container Apps Production URLs
        run: |
          echo "=========================================================="
          echo "🌐 AZURE PRODUCTION DEPLOYED CONTAINER APP ENDPOINTS:"
          FRONTEND_URL=$(az containerapp show --name app-ai20krosbag-production-frontend --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "app-ai20krosbag-production-frontend.eastus.azurecontainerapps.io")
          BACKEND_URL=$(az containerapp show --name app-ai20krosbag-production-backend --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "app-ai20krosbag-production-backend.eastus.azurecontainerapps.io")
          echo "Frontend Web UI : https://$FRONTEND_URL"
          echo "Backend API     : https://$BACKEND_URL"
          echo "API Health Check: https://$BACKEND_URL/health"
          echo "=========================================================="

      - name: Production Automated Health Check Gate
        run: |
          echo "Executing Azure Production Health Check Gate..."
          curl --fail --connect-timeout 10 --max-time 15 --retry 6 --retry-delay 10 ${{ env.PRODUCTION_HEALTH_URL }}
