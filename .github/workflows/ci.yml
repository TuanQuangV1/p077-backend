name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies (frozen)
        # --extra dev pulls the lint/type/test tools ([project.optional-dependencies]);
        # the default `dev` dependency-group (hypothesis) comes in automatically.
        run: uv sync --frozen --extra dev

      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --frozen --no-hashes --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code -- requirements.txt \
            || { echo "::error::requirements.txt is stale — run: uv export --frozen --no-hashes --no-dev --no-emit-project -o requirements.txt"; exit 1; }

      - name: Ruff
        run: uv run ruff check src/ tests/

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Blocking. No LLM key needed: playwright.config.ts starts the backend with
    # OPENAI_API_KEY=test-key, so every analysis takes the rule-based fallback
    # path — which is exactly what gate2.spec asserts. Measured green 33/33
    # against a test-key backend before this gate was turned on.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Backend deps: playwright.config.ts serves the API itself and picks up
      # the repo's .venv, which `uv sync` creates.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
      - name: Sync backend dependencies (frozen)
        working-directory: .
        run: uv sync --frozen

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # global-setup.ts aborts unless datasets h01 and f02 exist.
      - name: Seed e2e datasets
        working-directory: .
        run: uv run python scripts/seed_e2e.py

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
