name: Docker Security

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'presentation/**'
      - '.ai-log/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'presentation/**'
      - '.ai-log/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-scan:
    runs-on: [self-hosted, linux, x64]

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: backend
          load: true
          tags: app-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan backend image
        if: env.ACT != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: app-backend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Scan backend image (local)
        if: env.ACT == 'true'
        run: |
          IGNORE=$(grep -E '^CVE-' .trivyignore | tr '\n' ' ')
          docker run --rm --entrypoint sh \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.56.1 \
            -c "printf '%s\n' '$IGNORE' | tr ' ' '\n' > /.trivyignore && trivy image --ignorefile /.trivyignore --format table --severity HIGH,CRITICAL --exit-code 1 app-backend:${{ github.sha }}"

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: frontend
          load: true
          tags: app-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan frontend image
        if: env.ACT != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: app-frontend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Scan frontend image (local)
        if: env.ACT == 'true'
        run: |
          IGNORE=$(grep -E '^CVE-' .trivyignore | tr '\n' ' ')
          docker run --rm --entrypoint sh \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.56.1 \
            -c "printf '%s\n' '$IGNORE' | tr ' ' '\n' > /.trivyignore && trivy image --ignorefile /.trivyignore --format table --severity HIGH,CRITICAL --exit-code 1 app-frontend:${{ github.sha }}"