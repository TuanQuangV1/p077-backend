name: Trivy Security Scan

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'presentation/**'
      - '.ai-log/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'presentation/**'
      - '.ai-log/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem:
    name: Filesystem scan
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy filesystem scan
        if: env.ACT != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          args: --skip-dirs terraform --skip-dirs node_modules --skip-dirs .venv --skip-dirs .git --skip-dirs docs --skip-dirs presentation --skip-dirs .agents --skip-dirs .ai-log --skip-dirs .claude --skip-dirs .codex --skip-dirs .cursor --skip-dirs .gemini --skip-dirs .kilo --skip-dirs .kiro --skip-dirs dist --skip-dirs build --skip-dirs .next --skip-dirs .codegraph --skip-dirs .mypy_cache --skip-dirs .pytest_cache --skip-dirs .ruff_cache --skip-dirs .opencode --skip-dirs data --skip-dirs env

      - name: Trivy filesystem scan (local)
        if: env.ACT == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/aquasecurity/trivy:0.56.1 fs \
            --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs terraform --skip-dirs node_modules --skip-dirs .venv --skip-dirs .git \
            --skip-dirs docs --skip-dirs presentation --skip-dirs .agents --skip-dirs .ai-log \
            --skip-dirs .claude --skip-dirs .codex --skip-dirs .cursor --skip-dirs .gemini \
            --skip-dirs .kilo --skip-dirs .kiro --skip-dirs dist --skip-dirs build --skip-dirs .next \
            --skip-dirs .codegraph --skip-dirs .mypy_cache --skip-dirs .pytest_cache \
            --skip-dirs .ruff_cache --skip-dirs .opencode --skip-dirs data --skip-dirs env \
            /repo

  terraform:
    name: Terraform/IaC scan
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy IaC scan
        if: env.ACT != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy IaC scan (local)
        if: env.ACT == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/aquasecurity/trivy:0.56.1 config \
            --severity HIGH,CRITICAL --exit-code 1 /repo/terraform