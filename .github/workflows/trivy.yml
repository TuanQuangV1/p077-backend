name: Trivy Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  filesystem:
    name: Filesystem scan
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        if: env.ACT != 'true'
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy filesystem scan (local)
        if: env.ACT == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/aquasecurity/trivy:0.56.1 fs \
            --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --skip-dirs .venv /repo

  terraform:
    name: Terraform/IaC scan
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy IaC scan
        if: env.ACT != 'true'
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy IaC scan (local)
        if: env.ACT == 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/aquasecurity/trivy:0.56.1 config \
            --severity HIGH,CRITICAL --exit-code 1 /repo