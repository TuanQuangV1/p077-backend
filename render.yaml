services:
  - type: web
    name: p077-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: LOG_LEVEL
        value: INFO
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        value: test-pass
      - key: JWT_SECRET
        value: dev-insecure-jwt-secret-change-me-32-chars-minimum-length
