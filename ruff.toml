target-version = "py311"
line-length = 120
src = ["src", "tests", "frontend"]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",    # line too long (handled by black)
    "B008",    # do not perform function calls in argument defaults
    "PLR0912", # too many branches (rule engine accrues evaluation branches)
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments (rule engine aggregates)
    "PLR2004", # magic value comparison
]

[lint.isort]
known-first-party = ["api", "core", "services", "repositories", "schemas", "utils", "workers"]
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2

[lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
"__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
